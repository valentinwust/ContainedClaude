# Site defaults for the curry cluster (BioQuant Heidelberg). Used by default: install.sh and `containedclaude init`
# copy this file to site.ini (local, gitignored) if that does not exist yet. For another cluster start from
# site.example.ini instead (./install.sh site.example.ini). Projects override these in .contained/config.ini.

[sandbox]
# Network shares to mount at session/job start (shares not mounted at the start stay invisible inside).
automount = ~
    /mnt/sds-hd/*
    /media/*
    /software
# Where projects and write_paths may lie: strictly below one of these folders (real paths; ~ = the user's own
# home). Site-wide: a project's own config cannot change it. Empty = anywhere (not recommended).
allowed_roots = ~
    /mnt/sds-hd/sd17l002/u
    /mnt/sds-hd/sd17l002/p
# Size of the in-memory /tmp (+ /var/tmp, /dev/shm together) of interactive sessions on the login node.
tmp_size = 32G
# Memory limit of a whole interactive session (all processes + files in /tmp; systemd user scope). 0 = none.
# The session limits hold per sandbox: a Remote Control server and all the sessions it starts share them.
session_mem = 32G
# CPUs of the login node a session may use (affinity + low priority; a hard CPUQuota where the user
# manager has the cpu controller) and processes+threads of a session together. 0 = no limit.
session_cpus = 8
session_tasks = 300

[jobs]
partition = batch
# the A40 on curry58 is split into 32 shards; 8 = a quarter of the GPU
gpu_gres = shard:a40:8
cpus = 4
mem = 32G
time = 04:00:00
max_cpus = 72
max_mem = 700G
max_time = 1-00:00:00
max_gpu_jobs = 4
# What one project's jobs may use at the same time (empty = no limit; arrays throttled with %N count N tasks).
#max_total_cpus = 256
#max_total_mem = 2T
# Folders visible inside apptainer images.
image_binds = ~
    /mnt
    /media
    /software

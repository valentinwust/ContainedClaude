# ContainedClaude project configuration. Read-only inside the sandbox: edit it from outside.
# Values here override site.ini in the ContainedClaude clone, which overrides the built-in defaults. The
# commented lines show those defaults as they were when this file was made: uncomment a line to change it.
# Lists: one entry per line (indented) or separated by spaces. ~ and globs (*) are allowed.
# After editing, the next session (and every new job) uses the new values; CLAUDE_environment.md is refreshed
# at each start.

[sandbox]
# Extra writable folders besides this project (the project is always writable). They must not be or contain
# your home, ~/.config, ~/.local/bin or the ContainedClaude clone (code there runs outside the sandbox), must
# lie below one of the locations in allowed_roots of site.ini (site-wide, cannot be changed here), and no
# project can be set up inside them; the launcher refuses to start otherwise.
write_paths =
# Extra paths to hide (in addition to the built-in list of credentials/sockets, see EXPLANATIONS.md).
hide_paths =
# Paths inside hidden folders to show again read-only.
expose_paths =
# Extra files/folders inside the project to keep read-only (relative to the project).
protect_paths =
# Network shares to mount before the sandbox starts. Shares that are not mounted at the start stay invisible
# inside (a share mounted later would otherwise arrive writable).
#automount = {{site:sandbox.automount}}
# Use MCP servers from the contained Claude config (no: only those passed by the launcher, i.e. none).
mcp_from_user_config = no
# Give Codex its own config folder inside the sandbox.
codex = yes
# Size of the in-memory /tmp (together with /var/tmp and /dev/shm) of interactive sessions. Empty or 0 = no
# limit (half the login node's RAM).
#tmp_size = {{site:sandbox.tmp_size}}
# Memory limit of an interactive session as a whole (all its processes plus files in /tmp; a systemd user
# scope). Empty or 0 = no limit.
#session_mem = {{site:sandbox.session_mem}}
# CPU cores of a session (affinity to that many cores at low priority, thread variables set accordingly) and
# its processes+threads (a hard cgroup limit). 0 = no limit.
#session_cpus = {{site:sandbox.session_cpus}}
#session_tasks = {{site:sandbox.session_tasks}}

[jobs]
# Default image for cc-run: none (run directly in the sandbox on the node), a .sif path, or docker://...
#default_image = {{site:jobs.default_image}}
# What a job gets when cc-run is not told otherwise.
#cpus = {{site:jobs.cpus}}
#mem = {{site:jobs.mem}}
#time = {{site:jobs.time}}
#partition = {{site:jobs.partition}}
#gpu_gres = {{site:jobs.gpu_gres}}
# Limits enforced by the broker for every request from the sandbox. max_cpus/max_mem/max_time: per job.
# max_jobs: queued + running jobs of this project, every array task counted. max_gpu_jobs, max_total_cpus,
# max_total_mem: what the project's jobs may use AT THE SAME TIME (an array throttled with %N counts N tasks);
# empty = no limit.
#max_cpus = {{site:jobs.max_cpus}}
#max_mem = {{site:jobs.max_mem}}
#max_time = {{site:jobs.max_time}}
#max_jobs = {{site:jobs.max_jobs}}
#max_gpu_jobs = {{site:jobs.max_gpu_jobs}}
#max_array = {{site:jobs.max_array}}
#max_total_cpus = {{site:jobs.max_total_cpus}}
#max_total_mem = {{site:jobs.max_total_mem}}
# Folders bound into images (read-only unless writable above); the project is always bound.
#image_binds = {{site:jobs.image_binds}}
# Where cc-run puts executed notebooks (relative to the project).
#executed_dir = {{site:jobs.executed_dir}}
#apptainer_cache = {{site:jobs.apptainer_cache}}
# Extra sbatch options for every job of this project, one option per line (e.g. nodes to avoid, a QOS).
#extra_sbatch = --exclude=curry58,curry59

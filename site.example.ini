# Generic site defaults for a cluster other than curry. Use with `./install.sh site.example.ini` (copies it to
# site.ini, gitignored, if that does not exist) and adapt. Without an argument install.sh and `containedclaude
# init` use site.curry.ini. Projects override these in .contained/config.ini.

[sandbox]
# Network shares to mount at session/job start (shares not mounted at the start stay invisible inside).
automount = ~
# Where projects and write_paths may lie: strictly below one of these folders (real paths; ~ = the user's own
# home). Site-wide: a project's own config cannot change it. Empty = anywhere (not recommended).
allowed_roots = ~
# Size of the in-memory /tmp (+ /var/tmp, /dev/shm together) of interactive sessions (empty or 0 = no limit).
tmp_size = 32G
# Memory limit of a whole interactive session (all processes + files in /tmp; systemd user scope). 0 = none.
# The session limits hold per sandbox: a Remote Control server and all the sessions it starts share them.
session_mem = 32G
# CPUs of the login node a session may use (affinity + low priority; a hard CPUQuota where the user
# manager has the cpu controller) and processes+threads of a session together. 0 = no limit.
session_cpus = 8
session_tasks = 300

[jobs]
partition =
gpu_gres = gpu:1
cpus = 4
mem = 16G
time = 04:00:00
max_cpus = 64
max_mem = 500G
max_time = 7-00:00:00
max_gpu_jobs = 2
# What one project's jobs may use at the same time (empty = no limit; arrays throttled with %N count N tasks).
#max_total_cpus = 256
#max_total_mem = 2T
# Folders visible inside apptainer images.
image_binds = ~

[claude]
# The notice that tells an agent its context is close to auto-compaction, so it can write down what a summary
# would lose: this many tokens before compaction starts. 0 = never.
compact_notice = 25000
# Past this many tokens the main session is told that it may ask for compaction (`cc-compact`; refused
# below 90% of this), worth it when much of the context is no longer needed and much work remains.
# Its worker agents (cc:worker, cc:job-worker) compact at about 180k on their own. 0 = never.
compact_offer = 180000
# Tell it again each time its context has grown by this many tokens (until the notice above): a large
# context costs more with every request. 0 = only once.
compact_offer_every = 100000
# Before the prompt cache (1 hour) of an idle session with a large context expires: ask the agent to write down
# what matters, then compact right after its answer, so the next message doesn't send the whole context again
# at full price. Every contained session, also those a Remote Control server starts (Claude Code's own idle
# compaction skips those). idle_compact_after: minutes idle; idle_compact_min_tokens: smallest context it acts on.
idle_compact = yes
idle_compact_after = 50
idle_compact_min_tokens = 150000
